<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found, Dilshan Gulati</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Onest";src:url(/fonts/onest.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{background:#121319}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:#F4F2EE;font:17px/1.6 "Onest",system-ui,sans-serif;overflow:hidden}
.glow{position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 30% 30%,rgba(46,197,230,.28),transparent 70%),radial-gradient(40% 40% at 75% 35%,rgba(123,92,255,.28),transparent 70%),radial-gradient(45% 45% at 55% 85%,rgba(240,162,98,.2),transparent 70%)}
main{text-align:center;max-width:34rem}
.dot{width:64px;height:64px;margin:0 auto 26px;border-radius:50%;background:conic-gradient(from 0deg,#5CD6E8,#B48CFF,#E9B47F,#8BD45A,#5CD6E8);box-shadow:0 0 50px rgba(92,214,232,.35)}
@media (prefers-reduced-motion:no-preference){.dot{animation:spin 8s linear infinite}}
@keyframes spin{to{rotate:360deg}}
h1{margin:0;font:750 clamp(32px,6vw,52px)/1.08 "Onest",sans-serif;letter-spacing:-.03em}
p{color:#B0AFB9;margin:14px 0 28px}
a{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:99px;background:#F4F2EE;color:#18191D;font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid #9DF2E1;outline-offset:3px}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>This page doesn't exist</h1>
  <p>The link may be old or mistyped. Everything I've built is on the home page.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
